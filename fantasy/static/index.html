<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fantasy</title>
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#14224a">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%23ff6b1a'/><path d='M2 16h28M16 2v28M6 6c5 5 5 15 0 20M26 6c-5 5-5 15 0 20' fill='none' stroke='%2314224a' stroke-width='2'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>
  <div class="wrap">
    <header class="masthead">
      <div class="mast-top">
        <p class="dateline" id="date"></p>
        <div class="status">
          <span id="updated" aria-live="polite"></span>
          <button type="button" class="text-btn" data-action="refresh" id="refresh">Refresh</button>
        </div>
      </div>
      <h1 class="nameplate" id="nameplate">Fantasy</h1>
      <p class="greeting" id="greeting"></p>
      <nav class="tabs" id="tabs" aria-label="Sections"></nav>
    </header>

    <main id="view" tabindex="-1"></main>

    <footer class="foot">
      <p>Press <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> <kbd>4</kbd> to switch tabs and <kbd>R</kbd> to refresh.</p>
      <p>Box scores and schedules from EuroLeague, ESPN and ESAKE. Prices and domestic games from FantasyEdgeIQ. Injury report from BasketNews.</p>
    </footer>
  </div>
  <script src="/static/team.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
